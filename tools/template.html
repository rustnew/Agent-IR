<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="__SITE_URL__">
<meta property="og:type" content="website">
<meta property="og:title" content="__TITLE__">
<meta property="og:description" content="__DESCRIPTION__">
<meta property="og:url" content="__SITE_URL__">
<meta name="twitter:card" content="summary">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script>
  // Resolve the theme before first paint to avoid a flash.
  (function () {
    try {
      var stored = localStorage.getItem('agent-ir-theme');
      var dark = stored ? stored === 'dark'
                        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) { /* storage unavailable — keep the markup default */ }
  })();
</script>
</head>
<body>

<div class="topbar">
  <a class="brand" href="#top">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="5" cy="5" r="2.6" fill="currentColor"/>
      <circle cx="12" cy="5" r="2.6" fill="currentColor"/>
      <circle cx="19" cy="5" r="2.6" fill="currentColor"/>
      <circle cx="12" cy="19" r="2.6" fill="currentColor"/>
      <path d="M5 8v3.5a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 11.5V8M12 8v3M12 13v3.4"
            stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    Agent IR
  </a>
  <span class="chip">__VERSION__</span>
  <nav>
    <a href="__REPO_URL__/releases">Releases</a>
    <a href="__REPO_URL__">GitHub</a>
    <button class="iconbtn" id="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme">
      <svg class="theme-dark" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <svg class="theme-light" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </nav>
</div>

<header class="hero" id="top">
  <p class="eyebrow">__EYEBROW__</p>
  <h1>__HEADING__</h1>
  <p class="tagline">__TAGLINE__</p>
  <dl class="meta">
__META__
  </dl>
</header>

<div class="layout">
  <aside class="toc" aria-label="Table of contents">
    <p class="toc-title">Contents</p>
__TOC__
  </aside>

  <main class="prose">
    <details class="toc-mobile">
      <summary>Contents</summary>
      <div class="toc">
__TOC__
      </div>
    </details>
__CONTENT__
  </main>
</div>

<footer class="site-footer">
  <div class="inner">
    <span>Agent IR — specification __VERSION__. Working draft.</span>
    <span class="spacer"></span>
    <a href="__REPO_URL__">Source repository</a>
    <a href="__REPO_URL__/blob/main/README.md">README.md</a>
  </div>
</footer>

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs';
  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    securityLevel: 'strict',
    fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif',
    flowchart: { htmlLabels: true, curve: 'basis', padding: 12 },
    sequence: { useMaxWidth: true, wrap: true }
  });
  // Diagrams keep their light palette in both themes: the node fills are baked
  // into the source classDefs, so they are drawn on a white figure card.
  // They are rendered lazily — the document carries twelve of them, and doing
  // them all at load costs a visible pause on the first paint.
  const figures = Array.from(document.querySelectorAll('pre.mermaid'));
  let queue = Promise.resolve();
  const draw = (nodes) => {
    queue = queue
      .then(() => mermaid.run({ nodes }))
      .catch((err) => console.error('mermaid:', err));
  };

  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      const due = entries.filter((e) => e.isIntersecting).map((e) => e.target);
      due.forEach((el) => io.unobserve(el));
      if (due.length) draw(due);
    }, { rootMargin: '600px 0px' });
    figures.forEach((el) => io.observe(el));
  } else {
    draw(figures);
  }
</script>

<script>
  // Theme toggle
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('agent-ir-theme', next); } catch (e) {}
  });

  // Copy buttons on code blocks
  document.querySelectorAll('.codehilite').forEach(function (block) {
    var code = block.querySelector('pre');
    if (!code) return;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy-btn';
    btn.textContent = 'Copy';
    btn.addEventListener('click', function () {
      navigator.clipboard.writeText(code.innerText).then(function () {
        btn.textContent = 'Copied';
        setTimeout(function () { btn.textContent = 'Copy'; }, 1600);
      }, function () { btn.textContent = 'Failed'; });
    });
    block.appendChild(btn);
  });

  // Scrollspy: highlight the current section in the table of contents
  (function () {
    var links = {};
    document.querySelectorAll('.toc a[href^="#"]').forEach(function (a) {
      (links[a.getAttribute('href').slice(1)] ||= []).push(a);
    });
    var headings = Array.prototype.filter.call(
      document.querySelectorAll('.prose h2[id], .prose h3[id]'),
      function (h) { return links[h.id]; }
    );
    if (!headings.length) return;

    var current = null;
    function setActive(id) {
      if (id === current) return;
      document.querySelectorAll('.toc a.active').forEach(function (a) { a.classList.remove('active'); });
      document.querySelectorAll('.toc li.expanded').forEach(function (li) { li.classList.remove('expanded'); });
      current = id;
      (links[id] || []).forEach(function (a) {
        a.classList.add('active');
        for (var li = a.closest('li'); li; li = li.parentElement.closest('li')) li.classList.add('expanded');
        var box = a.closest('aside.toc');
        if (box && a.offsetTop < box.scrollTop || box && a.offsetTop > box.scrollTop + box.clientHeight - 40) {
          box.scrollTop = a.offsetTop - box.clientHeight / 2;
        }
      });
    }

    function update() {
      var y = window.scrollY + 100, found = headings[0];
      for (var i = 0; i < headings.length; i++) {
        if (headings[i].offsetTop <= y) found = headings[i]; else break;
      }
      setActive(found.id);
    }
    var ticking = false;
    window.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () { update(); ticking = false; });
    }, { passive: true });
    window.addEventListener('resize', update, { passive: true });
    update();
  })();
</script>
</body>
</html>
